[project]
name = "owervach-tmixer"
version = "0.1.0"
description = "Owervach TMixer - desktop app for randomizing Overwatch custom game teams"
readme = "README.md"
license = "MIT"
authors = [{name = "sathara", email = "sathara@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
owervach-tmixer = "owervach_tmixer.main:main"

[tool.setuptools.packages.find]
include = ["owervach_tmixer*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
owervach_tmixer = ["data/*.json", "assets/*.svg", "assets/Heroes/*.png"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
