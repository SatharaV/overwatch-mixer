<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D1B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E66B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC3333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#orangeGrad)" stroke-width="4"/>
  
  <!-- VS text -->
  <text x="64" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#orangeGrad)">VS</text>
  
  <!-- Team 1 indicator (blue) -->
  <circle cx="32" cy="64" r="12" fill="url(#blueGrad)" opacity="0.9"/>
  <text x="32" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1</text>
  
  <!-- Team 2 indicator (red) -->
  <circle cx="96" cy="64" r="12" fill="url(#redGrad)" opacity="0.9"/>
  <text x="96" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">2</text>
  
  <!-- Small role icons at bottom -->
  <!-- Tank -->
  <rect x="28" y="98" width="16" height="16" rx="3" fill="url(#blueGrad)" opacity="0.8"/>
  <!-- Damage -->
  <rect x="56" y="98" width="16" height="16" rx="3" fill="url(#redGrad)" opacity="0.8"/>
  <!-- Support -->
  <rect x="84" y="98" width="16" height="16" rx="3" fill="url(#orangeGrad)" opacity="0.8"/>
</svg>